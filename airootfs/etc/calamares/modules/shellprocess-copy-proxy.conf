# 把订阅链接从 live 环境复制到目标系统，供 post-install.sh 使用
# dontChroot: true —— 必须在目标挂载之后、且在 chroot 之外直接操作 /mnt/target
---
dontChroot: true
script: |
    set -u
    if [ -s /tmp/proxy_subscription ]; then
        install -m 600 /tmp/proxy_subscription /mnt/target/tmp/proxy_subscription 2>/dev/null \
            && echo "[copy-proxy] 订阅链接已复制到目标系统" \
            || echo "[copy-proxy] 复制失败（目标未挂载？），post-install 会跳过代理"
    else
        echo "[copy-proxy] 没有订阅链接，跳过"
    fi
