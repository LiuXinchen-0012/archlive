# 在目标系统里跑 post-install.sh：装 niri/dms、snapper、驱动、代理、greetd，
# 并部署首次启动删 KDE 的服务。
#
# dontChroot: true —— 让脚本自己 chroot 并做 /proc /sys /dev 绑定挂载。
#   原因：post-install.sh 有两种调用方式（standalone 手动跑 / 这里被调），
#   自己控制 chroot 可以避免嵌套 chroot，也能保证挂载点齐全 ——
#   pacman 在 chroot 里没有 /proc /sys /dev 会直接失败。
---
dontChroot: true
script: |
    set -u
    TARGET=/mnt/target
    if [ ! -d "$TARGET" ]; then
        echo "[post-install] 目标未挂载，跳过"
        exit 0
    fi
    if [ ! -f "$TARGET/usr/local/bin/post-install.sh" ]; then
        echo "[post-install] 目标系统里没有 post-install.sh —— skip"
        echo "[post-install] 可能是因为目标系统没被 unpackfs 填充过"
        exit 0
    fi
    TARGET_MOUNT="$TARGET" /usr/local/bin/post-install.sh
    rc=$?
    if [ $rc -ne 0 ]; then
        echo "[post-install] 返回 $rc，详见目标系统 /var/log/shorin-install.log"
    fi
    exit 0
