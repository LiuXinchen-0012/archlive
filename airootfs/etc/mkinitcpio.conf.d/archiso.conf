# ============================================================================
# archiso.conf —— initramfs 钩子配置
#
# ⚠️⚠️ 这个文件【必须有】，缺了 ISO 根本进不了 Live 桌面。
#
#   实测症状：ISO 构建成功、文件全齐、GRUB 也能引导内核，
#   但 initramfs 起来后一路走到
#       [FAILED] Failed to start Switch Root.
#   然后 emergency shell。
#
# 原因：我们没带这个文件，所以 pacman 装 linux-zen/linux-lts 时
#   生成的 initramfs 用的是【Arch 默认钩子】(只有 base 等)，
#   而里面【没有 archiso 钩子】。
#   archiso 钩子干的活是：
#     · 解析 archisosearchuuid= / archisobasedir=
#     · 找到启动介质，挂到 /run/archiso/bootmnt
#     · 挂载 ${archisobasedir}/${arch}/airootfs.sfs
#   没有它 → 找不到 squashfs → switch_root 失败。
#
#   官方 releng 的 configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf
#   就是这个文件，一字不差抄过来的。（栽过，白等了两轮 ISO）
#
# ⚠️ 别删任何 HOOKS：base 是根文件系统，udev 是设备，
#    block/filesystems 是挂载 squashfs 需要的，
#    archiso 那几个才是定位 ISO 的。
# ============================================================================
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)