#
# ARCH_SHORIN — pacman.conf
#
# 相对官方默认配置的改动：
#   1. 追加 [archlinuxcn]（国内社区源）
#   2. 追加 [build]（本地源，放自编译的 Calamares）
#   3. ParallelDownloads 调高（国内镜像带宽可以吃满）
#
# ⚠️ 注意 repo 段里必须用 Include 引入 mirrorlist，不能把 Server 指向 mirrorlist
#    文件 —— Server 要的是"仓库 URL"，写成 file://...mirrorlist 会让整个源失效。
#

[options]
# ⚠️ Architecture 【必须】有！这行漏了会直接让整个 ISO 构建失败。（栽过）
#    mirrorlist 里写的是 .../$repo/os/$arch/，$arch 要靠这一行展开；
#    没有它 pacman 直接报：
#        error: mirror 'https://.../$repo/os/$arch' contains the
#        '$arch' variable, but no 'Architecture' is defined.
#    而且报出来的位置在 mkarchiso 最末尾"生成已装包列表"那一步，
#    前面 4000 多行日志全是 INFO，看着像"跑了很久突然挂了"。
Architecture = auto

# 官方仓库签名必须校验（这是安全底线，别为了图省事关掉）
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

ParallelDownloads = 5

# ⚠️ 下面这两个老指令在现在的 pacman 里【已经不存在了】，会刷警告：
#     warning: directive 'DisableDownloadTimeout' in section 'options' not recognized
#     warning: directive 'CheckNews' in section 'options' not recognized
#   DisableDownloadTimeout 被合并进 Timeout，CheckNews 整个被 news 系统取代。
Timeout = 300

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[archlinuxcn]
# 社区仓库，路径结构不同（$arch/ 而不是 $repo/os/$arch/），所以单独一份 mirrorlist
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/mirrorlist.archlinuxcn

[build]
# ARCH_SHORIN 自编译的 Calamares。
# 由 build/build-calamares.sh 生成仓库内容并把 .db.tar.gz 放到 airootfs 下的
# build-repo/ 目录，再由这里的 Include 引入。
#
# 优先用相对路径（mkarchiso 会把 airootfs 挂到 workdir 下，这样最省事）；
# 如果你把仓库放在别处，改成绝对路径的 file:// URL 即可。
SigLevel = Optional
Include = /etc/pacman.d/build-repo.conf
