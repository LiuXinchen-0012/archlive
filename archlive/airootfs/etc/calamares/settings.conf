# ============================================================================
# ARCH_SHORIN — Calamares 主配置
#
# 相对原方案 4.4 的改动：
#   1. 删除 plasmalnf —— 它是选 Plasma 主题的模块，本项目装完要删 Plasma 换
#      Niri，选主题没有意义；而且原方案只把它放在 show、没放 exec，
#      按它自己的文档那样用是无效的（需 show+exec 各一次）。
#   2. proxysub 从"welcome 之后"移到"network 之后" —— 用户填订阅前应该已经
#      确认网络能用，否则他填完也验证不了。
#   3. 补上 hwdetect —— 原方案 exec 序列里没有它，但第 1 节要求
#      "硬件驱动检测"。Calamares 的 hwdetect 会把当前内核需要的模块写进
#      mkinitcpio 和 modprobe.d，比在 post-install 里瞎猜靠谱。
#   4. shellprocess 全部标 dontChroot: true，由 post-install.sh 自己 chroot
#      并做 /proc /sys /dev 绑定挂载（见脚本顶部说明）。
#   5. initramfs 保留 —— 我们在 PKGBUILD 里解开了它的 skip。
# ============================================================================

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - network
      - packagechooser
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - hwdetect            # ← 补上：内核模块按实际硬件注入
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - initramfs            # ← 保留：需在 PKGBUILD 里解开 skip
      # --- 代理相关：全部 dontChroot，在 live 环境跑 ---
      - shellprocess-copy-proxy
      - shellprocess-live-proxy
      # --- 目标系统装配 ---
      - shellprocess-postinstall
      - removeuser
      - umount
  - show:
      - finished
