# 在【live 环境】配置 TPClash 透明代理
#
# 时序：这一步在 shellprocess-postinstall 之前执行，是必须的。
# 因为 TPClash 走 TUN 透明代理，chroot 不创建新的 network namespace，
# 所以 live 环境里起的代理对 chroot 内的 pacman/yay 同样生效 ——
# 这正是"必须先配代理再装 shorin-dms-niri"能成立的原因。
#
# ⚠️ 不要加 http_proxy / https_proxy 环境变量。透明代理靠路由接管，
#    设了反而会让 chroot 内的 curl 指向一个不存在的本地端口。
---
dontChroot: true
script: |
    set -u
    SUB=/tmp/proxy_subscription
    if [ ! -s "$SUB" ]; then
        echo "[live-proxy] 没有订阅链接，跳过透明代理配置"
        echo "[live-proxy] 后续 AUR/DMS 安装可能因网络原因失败"
        exit 0
    fi

    if ! modprobe tun 2>/dev/null && [ ! -c /dev/net/tun ]; then
        echo "[live-proxy] 警告：/dev/net/tun 不可用，TUN 模式可能起不来"
    fi

    if /usr/local/bin/install-tpclash.sh --config-file "$SUB" --enable; then
        echo "[live-proxy] 透明代理已就绪"
    else
        echo "[live-proxy] TPClash 安装/启动失败，继续执行（不阻断安装）"
    fi
