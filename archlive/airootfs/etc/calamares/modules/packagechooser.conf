---
# 注意：packagechooser 在官方 AUR 的 calamares 里是被 SKIP 编译掉的，
# 已在 build/PKGBUILD.calamares-shorin 里解开。
# 这里【不选任何包】—— Live 里的包会被 unpackfs 整个复制到目标系统，
# 选额外包反而容易和 post-install 的安装步骤打架。
# 目标系统的软件由 post-install.sh 统一装，版本可控。
groups:
    - name: "shorin-noop"
      description: "本方案不额外选包（软件由 post-install 统一安装）"
      default: true
      packages: [ ]
