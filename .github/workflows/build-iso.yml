name: build-iso

# 手动触发；也可以推 tag 自动触发
on:
  workflow_dispatch:
    inputs:
      shorin_mode:
        description: 'SHORIN_MODE —— full(默认, 带 Shorin dotfiles) / skeleton(更轻, 只装官方 dms-shell)'
        type: choice
        options: [full, skeleton]
        default: full
      prebuild_aur:
        description: '预编译 AUR 包（full 模式需要；CI 在美国，GitHub 直连）'
        type: boolean
        default: true
      keep_aur:
        description: '把 AUR 编译缓存作为 artifact 留下（下次构建快很多）'
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 用官方 Arch 容器当环境 —— 你不需要自己有 Arch 机器
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
      options: --privileged

    # ⚠️ 路径必须用 github.workspace 推导，【绝对不能硬编码 /work】。
    #
    #    在 container job 里，actions/checkout 把仓库放在 $GITHUB_WORKSPACE
    #    （形如 /__w/<repo>/<repo>）下，再按 `path:` 追加一层，
    #    也就是 /__w/<repo>/<repo>/archlive —— 而不是 /work/archlive。
    #
    #    为什么这个坑特别难查：checkout 本身【会成功】（它确实放了文件，
    #    只是放到了别处），而紧接着那几步 pacman 命令根本不引用 PROFILE_DIR，
    #    于是前面一路绿灯，直到第一个真正读 $PROFILE_DIR 的步骤才炸。
    #    表现就是"随机地在某一步失败"，完全看不出跟路径有关。
    env:
      PROFILE_DIR: ${{ github.workspace }}/archlive
      WORK_DIR: ${{ github.workspace }}/w
      OUT_DIR: ${{ github.workspace }}/out
      REPO: ${{ github.workspace }}/archlive/build/repo
      SHORIN_MODE: ${{ github.event.inputs.shorin_mode || 'full' }}
      PREBUILD_AUR: ${{ github.event.inputs.prebuild_aur || 'true' }}
      KEEP_AUR: ${{ github.event.inputs.keep_aur || 'true' }}

    # ⚠️ 「容器内准备」那一步【不要】加 ckbcomp。
    #    它是 Calamares 的运行时依赖（键盘页预览键盘布局用），
    #    但它【不在官方仓库】，只有 AUR 有 —— 在只有官方源的环境里
    #    pacman -S ckbcomp 会直接 target not found，整个 job 就挂在这一步。
    #    它由 prebuild-aur.sh 从 AUR 编译后放进 [build] 源，最终进 ISO。
    steps:

      - name: 取回 profile
        uses: actions/checkout@v4
        with:
          path: archlive

      # 这一步是专门为了【别再猜路径】加的：
      # 路径猜错时，checkout 照样成功、后面几步照样绿灯，
      # 直到很后面才炸，日志里根本没有"路径不对"这个线索。
      # 这里直接把实际位置打出来，并且当场断言，5 秒内就知道对不对。
      - name: 确认仓库位置
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE = ${GITHUB_WORKSPACE:-<未设置>}"
          echo "PROFILE_DIR      = $PROFILE_DIR"
          echo "--- 全盘找 profiledef.sh ---"
          find / -name 'profiledef.sh' -not -path '/proc/*' 2>/dev/null | head -5
          if [ ! -f "$PROFILE_DIR/profiledef.sh" ]; then
            echo "::error::PROFILE_DIR 里没有 profiledef.sh —— 路径错了"
            echo "::error::看上面 find 的结果，那才是 checkout 真正落地的位置"
            exit 1
          fi
          echo "--- PROFILE_DIR 顶层内容 ---"
          ls -la "$PROFILE_DIR"
          echo "✓ 仓库位置正确"

      - name: 容器内准备
        shell: bash
        run: |
          # set -e 必须留着：关键命令一挂就立刻退出，EXIT trap 才能抓到现场。
          # （曾经试过去掉它，结果 pacman 挂了脚本继续跑，最后一行成功 rc=0，dump 根本不触发。）
          set -euo pipefail

          # ---- 挂了就把现场全 dump 出来 ----
          # 之前两次都是「26 秒 / 52 秒秒挂」，日志里只有一句
          # `target not found` 或者什么都没有，根本看不出是哪一环。
          # 这次失败会直接把 pacman/镜像/磁盘/DNS/keyring 的状态打出来。
          dump() {
            rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            echo "::group::❌ 失败现场 (exit=$rc)"
            echo "--- 失败的是哪一行 ---"
            echo "BASH_COMMAND = ${BASH_COMMAND:-?}"
            echo "--- pacman 版本 ---"
            pacman -V 2>&1 | head -3 || echo "  pacman 都跑不起来"
            echo "--- 实际生效的 mirrorlist（前5个）---"
            grep -vE '^\s*(#|$)' /etc/pacman.d/mirrorlist 2>&1 | head -5
            echo "--- 磁盘 ---"
            df -h / "$GITHUB_WORKSPACE" 2>&1 | tail -3
            echo "--- DNS 解析 ---"
            getent hosts geo.mirror.pkgbuild.com || echo "  ❌ DNS 解析失败"
            getent hosts mirror.rackspace.com  || echo "  ❌ 备用源也解析失败"
            echo "--- HTTPS 连通性（10 秒超时）---"
            curl -sSI --max-time 10 https://geo.mirror.pkgbuild.com/ 2>&1 | head -2 || echo "  ❌ 连不上"
            echo "--- keyring 状态 ---"
            pacman -Q archlinux-keyring 2>&1 || echo "  archlinux-keyring 没装"
            ls -la /etc/pacman.d/gnupg/ 2>&1 | head -5
            echo "--- 已装的关键包 ---"
            pacman -Q archiso qt6-base sudo 2>&1 | head -5
            echo "::endgroup::"
            exit $rc
          }
          trap dump EXIT

          echo "== 初始化 pacman keyring =="
          # --init 偶发失败（熵不够/并发），重试一次
          pacman-key --init || { echo "重试 pacman-key --init"; sleep 3; pacman-key --init; }
          pacman-key --populate archlinux

          echo "== 先单独升级 keyring =="
          # 老 keyring 会让后面的 -Syu 报 signature ... unknown trust
          pacman -Sy --noconfirm --needed archlinux-keyring || true
          pacman-key --populate archlinux || true

          echo "== 安装构建依赖 =="
          pacman -Syu --noconfirm --needed \
            git curl wget sudo rsync \
            base-devel cmake ninja extra-cmake-modules libglvnd \
            qt6-base qt6-declarative qt6-svg qt6-tools qt6-translations \
            kcoreaddons kpmcore yaml-cpp libpwquality hwinfo parted \
            archiso squashfs-tools libisoburn dosfstools mtools \
            nodejs npm

          echo "== 造 builder 用户 =="
          # makepkg 拒绝以 root 运行。
          #
          # ⚠️ 这里【必须】用 || ，不能用 &&。
          #    原写法是 `id builder && useradd -m -G wheel builder`：
          #    builder 本来就不存在 -> id 失败 -> && 短路 -> useradd 压根没跑
          #    -> set -e 也不拦（&& 列表里非末尾命令的失败不触发 set -e）
          #    -> 脚本若无其事走到下一行的 chown 才炸，
          #       错误信息写着 "chown: invalid user"，把人往错方向带。
          #    实测就是栽在这：26 秒和 52 秒两次秒挂都是这一步。
          #
          # wheel 组在 archlinux:base 里不一定存在，缺就建。
          # 不写 -g 10，让系统自己挑 GID（10 可能已经被别的组占了）。
          getent group wheel >/dev/null 2>&1 || groupadd wheel
          id builder  >/dev/null 2>&1 || useradd -m -G wheel builder
          # 确认真的建出来了，不然又是"命令成功但结果不对"
          id builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          # makepkg 产出的包要写进 PROFILE_DIR/build/，
          # 所以整个 workspace 都得交给 builder，不然后面步骤全是 permission denied
          chown -R builder:builder "${GITHUB_WORKSPACE:-$PROFILE_DIR}"

          echo "::group::版本"
          pacman -Q archiso qt6-base kcoreaddons sudo 2>&1 | head || true
          echo "::endgroup::"

      - name: 磁盘空间体检
        shell: bash
        run: |
          df -h / "$GITHUB_WORKSPACE" 2>/dev/null || df -h /
          avail=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')
          echo "可用: $((avail/1024/1024)) GB"
          if [ "$avail" -lt 10485760 ]; then
            echo "::warning::空间不足 10GB，构建可能失败。GitHub 标准 runner 磁盘有限。"
          fi

      - name: 选镜像源（CI 在美国，用官方源更快）
        shell: bash
        run: |
          bash "$PROFILE_DIR/build/use-mirror.sh" official
          head -8 "$PROFILE_DIR/airootfs/etc/pacman.d/mirrorlist"

      # ⭐ 这一步【必须在编译 Calamares 之前】。
      # 之前 preflight 排在编译之后，结果每轮都是：先花 10~25 分钟编 Qt，
      # 再被 pkgrel 格式、包名写错这种几秒钟就能查出来的问题打死。
      # --fast 只跑不依赖已编译产物的静态检查，2~3 分钟出结果。
      - name: 静态自检（编译前）
        shell: bash
        run: bash "$PROFILE_DIR/build/preflight.sh" --fast "$PROFILE_DIR"

      - name: 编译 Calamares
        shell: bash
        run: |
          sudo -u builder bash "$PROFILE_DIR/build/build-calamares.sh"
        env:
          MAKEFLAGS: '-j2'

      - name: 预置 TPClash 二进制（装机时就不用连 GitHub 了）
        shell: bash
        run: |
          sudo -u builder bash "$PROFILE_DIR/build/prefetch-binaries.sh" \
            || echo "::warning::TPClash 没能预置，装机时会现下"

      - name: 预编译 AUR 包
        if: ${{ env.SHORIN_MODE == 'full' && env.PREBUILD_AUR == 'true' }}
        shell: bash
        run: |
          sudo -u builder bash "$PROFILE_DIR/build/prebuild-aur.sh"
        env:
          MAKEFLAGS: '-j2'

      - name: 把本地仓库挂进宿主 pacman.conf
        shell: bash
        run: |
          db=$(ls -1 "$PROFILE_DIR"/airootfs/etc/pacman.d/build-repo/*.db.tar.gz 2>/dev/null | head -1)
          if [ -n "$db" ]; then
            echo "Include = $db" >> /etc/pacman.conf
            pacman -Sy --noconfirm
            echo "已接入: $db"
          else
            echo "::warning::没找到本地仓库数据库，preflight 可能报 calamares 缺失"
          fi

      - name: 自检
        shell: bash
        run: bash "$PROFILE_DIR/build/preflight.sh" "$PROFILE_DIR"

      - name: 校验 Calamares 配置
        shell: bash
        run: |
          cd "$PROFILE_DIR" && npm install js-yaml --silent --no-fund --no-audit
          node build/check-calamares.js airootfs/etc/calamares

      - name: 写构建模式
        shell: bash
        run: |
          printf '%s\n' "$SHORIN_MODE" > "$PROFILE_DIR/airootfs/etc/shorin-build-mode"
          chmod +x "$PROFILE_DIR"/airootfs/usr/local/bin/*.sh
          echo "shorin-build-mode = $SHORIN_MODE"
          cat "$PROFILE_DIR/airootfs/etc/shorin-build-mode"

      - name: 构建 ISO
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"; mkdir -p "$WORK_DIR" "$OUT_DIR"
          mkarchiso -v -w "$WORK_DIR" -o "$OUT_DIR" "$PROFILE_DIR"
          ls -lh "$OUT_DIR"/*.iso

      - name: 产物校验
        shell: bash
        run: |
          iso=$(ls -1 "$OUT_DIR"/archlinux-shorin-*.iso | head -1)
          echo "ISO: $iso"
          du -h "$iso"
          sha256sum "$iso" | tee "$OUT_DIR/sha256sum.txt"
          echo "条目数: $(bsdtar -tf "$iso" | wc -l)"
          isoinfo -d -i "$iso" 2>/dev/null | grep -i "volume id" || true

      - name: 上传 ISO
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-shorin-iso
          path: |
            ${{ env.OUT_DIR }}/*.iso
            ${{ env.OUT_DIR }}/sha256sum.txt
          retention-days: 30
          if-no-files-found: error

      - name: 上传 AUR 缓存（下次构建快很多）
        if: ${{ env.KEEP_AUR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aur-cache
          path: |
            ${{ env.PROFILE_DIR }}/build/aur-pkgs/**/*.pkg.tar.zst
          retention-days: 30
          if-no-files-found: ignore

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.WORK_DIR }}/
            ${{ env.PROFILE_DIR }}/build/calamares-build/
          retention-days: 7
          if-no-files-found: ignore
